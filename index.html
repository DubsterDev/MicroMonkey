<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroMonkey</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=developer_board,terminal" />
</head>
<body>
    <main>
        <div class="mostContent">
            <div class="leftSidebar">
                <p>FILE EXPLORER</p>
                <div data-file-explorer-path="/"></div>
            </div>
            <div class="rightPanel" id="rightPanel">
                <div id="codeEditor"></div>
                <div class="serialMonitor" id="serialMonitor">
                </div>
            </div>
        </div>
        <div class="bottomBar">
            <div id="findPorts">
                <i class="material-symbols-outlined">developer_board</i>
                <span id="boardStatus">Connect to board</span>
            </div>
            <div id="openSerialMonitor">
                <i class="material-symbols-outlined">terminal</i>
                <span id="boardStatus">Serial Monitor</span>
            </div>
        </div>
    </main>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
