<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroMonkey</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=close,code,create_new_folder,developer_board,keyboard_arrow_down,keyboard_arrow_right,note_add,settings,terminal" />
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <main>
        <div class="mostContent">
            <div class="leftSidebar">
                <div class="fileExplorerHeader">
                    <h3>File Explorer</h3>
                    <div class="newActions">
                        <button class="material-symbols-outlined" id="newFileRoot">note_add</button>
                        <button class="material-symbols-outlined" id="newFolderRoot">create_new_folder</button>
                    </div>
                </div>
                <div data-file-explorer-path="/"></div>
            </div>
            <div class="rightPanel" id="rightPanel">
                <div id="tabs" class="tabs"></div>
                <div id="customEditor"></div>
                <div id="codeEditor"></div>
                <div class="serialMonitor" id="serialMonitor">
                </div>
            </div>
        </div>
        <div class="bottomBar">
            <div class="left">
                <div id="findPorts" class="item">
                    <i class="material-symbols-outlined">developer_board</i>
                    <span id="boardStatus">Connect to board</span>
                </div>
                <div id="openSerialMonitor" class="item">
                    <i class="material-symbols-outlined">terminal</i>
                    <span>Serial Monitor</span>
                </div>
            </div>
            <div class="right">
                <div id="openSettings" class="item">
                    <i class="material-symbols-outlined">settings</i>
                    <span>Settings</span>
                </div>
            </div>
        </div>
        <div class="rightClickMenu" id="contextMenu">
        </div>
        <div class="commandPalette" id="commandPalette">
            <input type="text" autocomplete="off" id="commandPaletteInput">
            <div class="suggestions" id="commandPaletteSuggestions">

            </div>
        </div>
    </main>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
