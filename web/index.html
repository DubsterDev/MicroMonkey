<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroMonkey</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_insert,check_circle,chevron_left,chevron_right,close,code,create_new_folder,developer_board,error,keyboard_arrow_down,keyboard_arrow_right,note_add,refresh,save,settings,terminal,warning" />
    <link rel="stylesheet" href="/src/style.css">
    <link rel="shortcut icon" href="/assets/monkeyheadshot.png" type="image/x-icon">
    <meta name="color-scheme" content="dark light">
</head>
<body>
    <main>
        <div class="mostContent">
            <div class="leftSidebar" id="leftSidebar">
                <div class="fileExplorerHeader">
                    <h3>Files</h3>
                    <div class="newActions">
                        <button class="material-symbols-outlined" id="reloadFileExplorer">refresh</button>
                        <button class="material-symbols-outlined" id="newFileRoot">note_add</button>
                        <button class="material-symbols-outlined" id="newFolderRoot">create_new_folder</button>
                    </div>
                </div>
                <div data-file-explorer-path="/"></div>
            </div>
            <div class="rightPanel" id="rightPanel">
                <div id="tabs" class="tabs"></div>
                <div id="customEditor"></div>
                <div id="codeEditor"></div>
                <div class="serialMonitor" id="serialMonitor">
                </div>
            </div>
        </div>
        <div class="bottomBar">
            <div class="left">
                <div id="openFileExplorer" class="item onlyOnMobile">
                    <i class="material-symbols-outlined" id="fileExplorerOpenDirection">chevron_right</i>
                    <span>File Explorer</span>
                </div>
                <div id="findPorts" class="item">
                    <i class="material-symbols-outlined">developer_board</i>
                    <span id="boardStatus">Connect to board</span>
                </div>
                <div id="openSerialMonitor" class="item">
                    <i class="material-symbols-outlined">terminal</i>
                    <span>Serial Monitor</span>
                </div>
            </div>
            <div class="right">
                <div id="saveFile" class="item" style="display: none;">
                    <i class="material-symbols-outlined">save</i>
                    <span>Save File</span>
                </div>
                <div id="openCommandPalette" class="item">
                    <i class="material-symbols-outlined">arrow_insert</i>
                    <span>Command Palette</span>
                </div>
                <div id="openSettings" class="item">
                    <i class="material-symbols-outlined">settings</i>
                    <span>Settings</span>
                </div>
            </div>
        </div>
        <div class="rightClickMenu" id="contextMenu">
        </div>
        <div class="commandPalette" id="commandPalette">
            <h4 id="commandPaletteTitle">Command Palette</h4>
            <input type="text" autocomplete="off" id="commandPaletteInput">
            <div class="suggestions" id="commandPaletteSuggestions">

            </div>
        </div>
    </main>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
